<!--HTML HyperText Markup Language, es un lenguaje de marcado de hipertexto -->

<!DOCTYPE html>
<!--html es una etiqueta y el atributo lang indica el idioma del contenido de la página web, en este caso español -->
<html lang="es">
<!--head es una etiqueta que contiene información sobre el documento, como el título, los metadatos y los enlaces a archivos externos -->
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Encuentra las mejores ofertas de trabajo para desarrolladores en DevJobs.">
    <title>DevJobs - Inicio</title>
</head>
<!--body es una etiqueta que contiene el contenido visible de la página web -->
<body>
    <!--header es una etiqueta que contiene el encabezado de la página web -->
    <header>
        <!-- La etiqueta <h2> contiene el título principal de la página -->
        <h2>DevJobs</h2>
        <!-- La etiqueta <nav> contiene el menú de navegación -->
        <nav>
            <a href="">Inicio</a>
            <a href="">Empleos</a>
        </nav>
        <!-- La etiqueta <div> es un contenedor generico sin significado semantico,como una caja invisible para organizar elementos -->
        <div>
            <a href="">Publicar un Empleo</a>
            <a href="">Iniciar Sesión</a>
        </div>
    </header>
    <!--main es una etiqueta que contiene el contenido principal de la página web -->
    <main>
        <section>
            <img src="/background.webp" width="100%" height="auto" />
        </section>
    </main>
    <!--footer es una etiqueta que contiene el pie de página de la página web -->
    <footer>

    </footer>
</body>
</html>
